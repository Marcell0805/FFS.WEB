<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CI replaces this for GitHub project pages: /FFS.WEB/ -->
    <base href="/" />
    <title>F.F.S</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
    <link rel="icon" type="image/png" href="branding/icon.png" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="FFS.Web.styles.css" />
</head>

<body>
    <div id="app">
        <div class="splash-screen splash-pending" aria-busy="true"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <script>
        window.ffsTheme = {
            set: function (theme) {
                document.documentElement.setAttribute('data-theme', theme || 'light');
            },
            get: function () {
                return localStorage.getItem('ffs-theme');
            },
            save: function (theme) {
                localStorage.setItem('ffs-theme', theme);
            }
        };
        window.ffsSplash = {
            /** Once per browser tab — survives F5 / hard refresh until the tab is closed. */
            shouldShow: function () {
                try {
                    return sessionStorage.getItem('ffs-splash-seen') !== '1';
                } catch (e) {
                    return true;
                }
            },
            markSeen: function () {
                try { sessionStorage.setItem('ffs-splash-seen', '1'); } catch (e) { }
            },
            applyDocumentFlag: function () {
                try {
                    if (sessionStorage.getItem('ffs-splash-seen') === '1') {
                        document.documentElement.classList.add('ffs-skip-splash');
                    } else {
                        document.documentElement.classList.remove('ffs-skip-splash');
                    }
                } catch (e) { }
            }
        };
        window.ffsDownload = function (filename, text) {
            var blob = new Blob([text], { type: 'text/csv;charset=utf-8' });
            var url = URL.createObjectURL(blob);
            var a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        };
        window.ffsSplash.applyDocumentFlag();
        try {
            var theme = localStorage.getItem('ffs-theme') || 'dark';
            document.documentElement.setAttribute('data-theme', theme);
        } catch (e) { }
    </script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
