name: Deploy Blazor App to GitHub Pages

on:
  push:
    branches: ["main", "master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          # SDK 8 builds this net8.0 WASM app (10.x also works)
          dotnet-version: "8.0.x"

      - name: Publish Blazor WebAssembly
        run: dotnet publish src/FFS.Web/FFS.Web.csproj -c Release -o publish

      - name: Prepare GitHub Pages site
        run: |
          # Custom domain: https://ffs.foxbytelabs.co.za/ (root, not /FFS.WEB/)
          printf 'ffs.foxbytelabs.co.za\n' > publish/wwwroot/CNAME
          # SPA deep-links: GitHub Pages serves 404.html for unknown paths
          cp publish/wwwroot/index.html publish/wwwroot/404.html
          touch publish/wwwroot/.nojekyll

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
